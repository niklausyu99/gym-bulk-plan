<title>BulkPlan · 训练与饮食手帐</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
<link rel="stylesheet" href="app/style.css">
<link rel="stylesheet" href="app/mobile.css">
<link rel="stylesheet" href="app/recipe.css">
<link rel="stylesheet" href="app/muscle-map.css">
<link rel="stylesheet" href="app/equipment.css">

<script src="app/blend.js" defer></script>

<script src="app/equipment.js" defer></script>

<body>
<a class="skip" href="#main">跳到主要内容</a>
<aside id="sidebar"></aside>
<main id="main" tabindex="-1"></main>
<div id="app-dock"><div id="update-notice" hidden></div><div id="timer" hidden></div><div id="toast" role="status" aria-live="polite"></div></div>
<nav id="mobile-nav" aria-label="主要导航"></nav>
<dialog id="details" aria-labelledby="dialog-title"><div class="dialog-top"><span>BulkPlan</span><button class="close-dialog" type="button" aria-label="关闭详情">关闭 <span aria-hidden="true">×</span></button></div><div id="dialog-content"></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message"><h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p><div class="confirm-actions"><button id="confirm-cancel" class="btn secondary" type="button">取消</button><button id="confirm-continue" class="btn" type="button">继续</button></div></dialog>
<dialog id="image-zoom" aria-labelledby="zoom-title"><header><h2 id="zoom-title">图片大图</h2><button type="button" id="zoom-close">关闭 ×</button></header><div id="zoom-canvas"><img id="zoom-image" alt=""></div><footer><button type="button" id="zoom-minus" aria-label="缩小图片">−</button><button type="button" id="zoom-reset">100%</button><button type="button" id="zoom-plus" aria-label="放大图片">＋</button><span>双指缩放 · 拖动查看</span></footer></dialog>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<noscript>BulkPlan 需要启用 JavaScript。</noscript>
</body>
</html>
